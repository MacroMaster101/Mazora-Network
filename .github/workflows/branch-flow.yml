name: Branch flow

# Changes reach main only through Dev: feature branches -> Dev -> main.
# Rulesets cannot restrict which branch a pull request comes from, so this
# check does, and the main ruleset requires it.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  dev-only-into-main:
    name: Dev only into main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the source branch
        env:
          # Through env, never interpolated into the script: branch names are
          # chosen by whoever opens the pull request.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "Dev" ]; then
            echo "::error::Pull requests into main must come from Dev (this one comes from '$HEAD_REF'). Open it against Dev instead."
            exit 1
          fi
          echo "Source branch is Dev."
